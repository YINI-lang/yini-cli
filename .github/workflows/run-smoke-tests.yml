name: Smoke Tests (fast)

on:
    pull_request: # PR:s **Pre-merge** (Good for fast feedback before merge. - Secrets: Not available for PRs from forks (by default).)
    workflow_dispatch: # allows manual run from GitHub UI

jobs:
    run-smoke-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Print Node.js version
              run: node --version

            - name: Install dependencies (no scripts)
              run: npm ci --ignore-scripts # npm clean-install (installs without changing package-lock.json)

            - name: Lint
              run: npm run lint

            - name: Check workflow formatting
              run: npx prettier --check .github/workflows

            - name: Build
              run: npm run build

            - name: Run smoke tests
              run: npm run ci:test:smoke
