name: Publish npm package (provenance)

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write # Needed for npm provenance.

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install (no scripts)
              run: npm ci --ignore-scripts

            - name: Lint
              run: npm run lint

            - name: Build package
              run: npm run build

            - name: Publish to npm
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [[ "$GITHUB_REF_NAME" != "$version" && "$GITHUB_REF_NAME" != "v$version" ]]; then
                      echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version"
                      exit 1
                  fi

                  version_without_build="${version%%+*}"
                  tag=latest

                  if [[ "$version_without_build" == *-* ]]; then
                      prerelease="${version_without_build#*-}"
                      if [[ "$prerelease" == beta || "$prerelease" == beta.* ]]; then
                          tag=beta
                      else
                          echo "::error::Unsupported prerelease version: $version"
                          exit 1
                      fi
                  fi

                  npm publish --provenance --tag "$tag" --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
